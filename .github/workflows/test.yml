name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DotSexpr.slnx

      - name: Build
        run: dotnet build DotSexpr.slnx -c Release --no-restore

      - name: Test net10.0
        run: dotnet test tests/DotSexpr.Tests/DotSexpr.Tests.csproj -c Release --no-build --no-restore

      - name: Test netstandard2.1
        run: dotnet test tests/DotSexpr.Tests/DotSexpr.Tests.csproj -c Release --no-restore -p:DotSexprTargetFramework=netstandard2.1

      - name: Test source generator
        run: dotnet test tests/DotSexpr.SourceGenerator.Tests/DotSexpr.SourceGenerator.Tests.csproj -c Release --no-build --no-restore

      - name: Pack
        run: dotnet pack src/DotSexpr/DotSexpr.csproj -c Release --no-build --no-restore --output packages

      - name: Test NuGet package
        run: |
          dotnet restore tests/DotSexpr.PackageTests/DotSexpr.PackageTests.csproj -p:UseNuGetPackage=true --source ./packages --packages "${{ runner.temp }}/dotsexpr-packages"
          dotnet run --project tests/DotSexpr.PackageTests/DotSexpr.PackageTests.csproj -c Release --no-restore -p:UseNuGetPackage=true

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget
          path: packages/*.nupkg
          if-no-files-found: error

  native-aot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: DotSexpr.PackageTests
          - os: windows-latest
            rid: win-x64
            executable: DotSexpr.PackageTests.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack src/DotSexpr/DotSexpr.csproj -c Release --output packages

      - name: Restore Native AOT package test
        run: dotnet restore tests/DotSexpr.PackageTests/DotSexpr.PackageTests.csproj -r ${{ matrix.rid }} -p:UseNuGetPackage=true -p:PublishAot=true --configfile .github/nuget-native-aot.config --packages "${{ runner.temp }}/dotsexpr-aot-packages"

      - name: Publish Native AOT package test
        run: dotnet publish tests/DotSexpr.PackageTests/DotSexpr.PackageTests.csproj -c Release -r ${{ matrix.rid }} --no-restore -p:UseNuGetPackage=true -p:PublishAot=true --output artifacts/native-aot

      - name: Run Native AOT package test
        shell: pwsh
        run: |
          & "./artifacts/native-aot/${{ matrix.executable }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
